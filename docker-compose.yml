
version: "3"

services:

  db:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hrms
    ports:
      - "3306:3306"

  redis:
    image: redis:7

  backend:
    image: python:3.11
    working_dir: /app
    volumes:
      - .:/app
    command: python app.py
    ports:
      - "8000:8000"
